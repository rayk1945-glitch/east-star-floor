<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>East Star Building Supply 劍鋒高級建材</title>
<style>
  :root { --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --blue:#1A8BC9; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:var(--text); background:var(--bg); }
  .wrap { max-width:760px; margin:0 auto; padding:0 0 24px; }
  .lang { position:absolute; top:12px; right:12px; border:1px solid var(--line); background:#fff; border-radius:999px; min-height:36px; padding:0 12px; font:inherit; font-size:14px; font-weight:700; color:var(--text); cursor:pointer; }
  header { position:relative; background:#fff; border-bottom:1px solid var(--line); padding:18px 16px 14px; text-align:center; }
  header svg { width:200px; height:auto; display:block; margin:0 auto; }
  h1 { font-size:22px; margin:14px 0 2px; }
  .sub { color:var(--muted); font-size:13px; }
  .note { background:#fff; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:12px 0; padding:14px 16px; }
  @media (min-width:640px) { .note { border:1px solid var(--line); border-radius:14px; margin:14px 12px; } }
  .note h2 { font-size:18px; margin:0 0 6px; }
  .ntext { white-space:pre-wrap; margin:0 0 10px; }
  .item { display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; }
  .ph { width:64px; height:64px; flex:none; border:1px solid var(--line); border-radius:10px; background:#fff; object-fit:contain; padding:2px; }
  .ph.none { background:#f3f4f6; }
  .it { flex:1; min-width:0; }
  .nm { font-weight:600; word-break:break-word; }
  .ds { color:var(--muted); font-size:14px; word-break:break-word; }
  .in { font-size:14px; margin-top:2px; }
  .qty { flex:none; font-weight:600; white-space:nowrap; padding-top:1px; }
  .items { margin-top:4px; }
  .photos { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .photos img, .photos .ld { width:104px; height:104px; border-radius:10px; object-fit:cover; background:#eef0f3; cursor:zoom-in; display:block; }
  .empty { color:var(--muted); font-size:14px; }
  footer { margin:18px 12px 0; padding:16px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  footer h3 { margin:0 0 10px; font-size:15px; }
  .stores { display:grid; grid-template-columns:1fr 1fr; gap:14px; font-size:14px; }
  @media (max-width:420px) { .stores { grid-template-columns:1fr; } }
  .stores b { display:block; }
  .stores a { color:var(--blue); text-decoration:none; }
  .web { margin-top:12px; font-size:13px; color:var(--muted); text-align:center; }
  .web a { color:var(--muted); }
  .msgbox { margin:40px 16px; text-align:center; color:var(--muted); }
  .spin { width:28px; height:28px; border:3px solid #dbe1e8; border-top-color:var(--blue); border-radius:50%; margin:40px auto; animation:r 0.8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:none; align-items:center; justify-content:center; z-index:9; }
  #zoom.on { display:flex; } #zoom img { max-width:96vw; max-height:92vh; }

  /* ---- East Star brand (eaststarusa.com): blue #0078bd / hover #005d9a, navy #15334b, red accent #c92330,
     light #f6f8fa, lines #d9e4ec, muted #526776, Montserrat, pill buttons. ---- */
  :root { --bg:#f6f8fa; --text:#15334b; --muted:#526776; --line:#d9e4ec; --line-strong:#c3d3df; --accent:#0078bd; --brand-dark:#005d9a;
    --navy:#15334b; --red:#c92330; --focus:rgba(0,120,189,.28); --info-bg:#e6f2fa; --info-fg:#005d9a; }
  body { font-family:Montserrat,-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; letter-spacing:-.005em; }
  h1, h2, h3 { color:var(--navy); }
  header { background:rgba(255,255,255,.96); border-bottom:2px solid var(--accent); }
  .btn { background:var(--accent); font-weight:600; letter-spacing:.01em; }
  .btn:active, .btn:hover { background:var(--brand-dark); }
  .btn.sec { color:var(--accent); border-color:var(--accent); background:#fff; }
  .link { color:var(--accent); }
  .chip { background:#e6f2fa; color:#005d9a; }
  .toplinks button { border-color:var(--line-strong); color:var(--navy); }
  .toplinks button.plan { background:var(--red); border-color:var(--red); color:#fff; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  #signin .card { border-top:4px solid var(--accent); }
  header { border-bottom:3px solid var(--accent); } a { color:var(--accent); } .lang { color:var(--navy); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <button class="lang" data-lang-toggle="1" type="button">中文</button>
    <svg viewBox="-4 -3 270 126" role="img" aria-label="East Star Building Supply">
      <path d="M0 31V0H136V118H0V87" fill="none" stroke="#303030" stroke-width="2.2"/>
      <text x="-1" y="77" font-size="30" font-weight="200" fill="#303030" textLength="97" lengthAdjust="spacing" font-family="Helvetica Neue, Arial, sans-serif">EAST</text>
      <text x="154" y="47" font-size="32.5" font-weight="700" fill="#1A8BC9" textLength="104" lengthAdjust="spacingAndGlyphs" font-family="Helvetica Neue, Arial, sans-serif">STAR</text>
      <text x="154" y="65" font-size="7.2" font-weight="500" fill="#9A9A9A" textLength="106" lengthAdjust="spacing" font-family="Helvetica Neue, Arial, sans-serif">BUILDING SUPPLY</text>
      <text x="153" y="91" font-size="20.6" fill="#1A8BC9" textLength="106" lengthAdjust="spacingAndGlyphs">劍鋒高級建材</text>
    </svg>
    <h1 id="title">&nbsp;</h1>
    <div class="sub" id="sub"></div>
  </header>
  <main id="main"><div class="spin"></div></main>
  <footer>
    <h3>Questions? Visit or call us</h3>
    <div class="stores">
      <div><b>San Francisco</b>1945 Carroll Ave<br>San Francisco, CA 94124<br><a href="tel:+14154672888">(415) 467-2888</a></div>
      <div><b>Fremont</b>48460 Kato Road<br>Fremont, CA 94538<br><a href="tel:+15102574888">(510) 257-4888</a></div>
    </div>
    <div class="web">Mon – Sat 8:30 AM – 5:30 PM · <a href="https://eaststarusa.com" rel="noopener">eaststarusa.com</a></div>
  </footer>
</div>
<div id="zoom"><img alt=""></div>
<script>
// The sharer's language rides along (&l=zh) the first time; after that the client's own toggle is remembered.
try { if (/[?&]l=zh\b/.test(location.search) && !localStorage.getItem('esLang')) localStorage.setItem('esLang', 'zh'); } catch (e) {}
</script>
<script src="i18n.js?v=20261012a"></script>
<script>
// Read-only client view of one project (client.html?c=TOKEN). No sign-in, no item data download, no prices:
// the server answers token requests with a whitelist copy (titles, text, items, qty, item notes, photos) only.
var API_URL = 'https://script.google.com/macros/s/AKfycbzmMaB6B78-sJABGFGZ9vpLGsCSN67lPF3hf0aGIM8AVLbsKJrdCKovVZDi6nKdXNTO/exec';   // set by set_exec_url.sh
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) API_URL = '/api';   // local test server only
var TOKEN = (new URLSearchParams(location.search).get('c') || '').trim();
function T(s) { return window.I18N ? I18N.t(s) : s; }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function call(action, data) {
  var body = Object.assign({ action: action, c: TOKEN }, data || {});
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', credentials: 'omit' })
    .then(function (r) { return r.json(); }, function () { throw new Error('No connection. Check your internet and reload the page.'); })
    .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'Something went wrong.'); return j.data; });
}
function fail(m) { $('title').textContent = 'East Star Building Supply'; $('sub').textContent = ''; $('main').innerHTML = '<div class="msgbox">' + esc(m) + '</div>'; }
function render(p) {
  var title = p.name ? p.name : (p.num ? 'Project #' + p.num : 'Your project');
  if (window.I18N) I18N.setTitle(title + ' · East Star Building Supply'); else document.title = title + ' · East Star Building Supply';
  $('title').textContent = title; $('title').classList.toggle('notr', !!p.name);
  $('sub').textContent = (p.name && p.num ? 'Project #' + p.num + ' · ' : '') + (p.updated ? 'Updated ' + new Date(p.updated).toLocaleDateString(window.I18N && I18N.lang() === 'zh' ? 'zh-CN' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '');
  var notes = (p.notes || []).filter(function (n) { return n.text || (n.items || []).length || (n.photos || []).length; });
  if (!notes.length) { $('main').innerHTML = '<div class="msgbox">Nothing has been added to this project yet.</div>'; return; }
  $('main').innerHTML = notes.map(function (n) {
    return '<section class="note"><h2 class="notr">' + esc(n.title) + '</h2>' + (n.text ? '<p class="ntext notr">' + esc(n.text) + '</p>' : '') +
      ((n.items || []).length ? '<div class="items">' + n.items.map(function (l) {
        return '<div class="item">' + (l.photo ? '<img class="ph" loading="lazy" src="' + esc(l.photo) + '" alt="" onerror="this.className=\'ph none\';this.removeAttribute(\'src\')">' : '<div class="ph none"></div>') +
          '<div class="it notr"><div class="nm">' + esc(l.name) + '</div>' + (l.desc ? '<div class="ds">' + esc(l.desc) + '</div>' : '') + (l.note ? '<div class="in">' + esc(l.note) + '</div>' : '') + '</div>' +
          '<div class="qty">× ' + esc(l.qty) + '</div></div>'; }).join('') + '</div>' : '') +
      ((n.photos || []).length ? '<div class="photos">' + n.photos.map(function (f) { return '<span class="ld" data-f="' + esc(f) + '"></span>'; }).join('') + '</div>' : '') + '</section>';
  }).join('');
  // note photos: one at a time (each is a separate small request)
  var q = [].slice.call(document.querySelectorAll('.photos .ld'));
  (function next() { var el = q.shift(); if (!el) return;
    call('clientFile', { fileId: el.dataset.f }).then(function (r) { var im = document.createElement('img'); im.src = r.data; im.alt = 'photo'; el.replaceWith(im); }, function () { el.remove(); }).then(next); })();
}
document.addEventListener('click', function (e) { var im = e.target.closest('.photos img'); if (im) { $('zoom').querySelector('img').src = im.src; $('zoom').classList.add('on'); } else if (e.target.closest('#zoom')) $('zoom').classList.remove('on'); });
if (!/^[a-f0-9]{48,64}$/i.test(TOKEN)) fail('This link is not complete. Ask East Star for the link again.');
else call('clientView').then(render).catch(function (er) { fail(er.message); });
</script>
</body>
</html>

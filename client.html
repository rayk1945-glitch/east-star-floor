<style>

  .web { margin-top:12px; font-size:13px; color:var(--muted); text-align:center; }
  .web a { color:var(--muted); }
  .msgbox { margin:40px 16px; text-align:center; color:var(--muted); }
  .spin { width:28px; height:28px; border:3px solid #dbe1e8; border-top-color:var(--blue); border-radius:50%; margin:40px auto; animation:r 0.8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:none; align-items:center; justify-content:center; z-index:9; }
  #zoom.on { display:flex; } #zoom img { max-width:96vw; max-height:92vh; }
  .dl { font-size:12.5px; line-height:1.35; margin-top:1px; } .dl a { color:var(--accent); text-decoration:none; font-weight:600; } .dl .sep { color:var(--muted); padding:0 4px; }
  .ph[src] { cursor:zoom-in; }
  #zoom .zx { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; width:40px; height:40px; border-radius:50%; border:0; background:#fff; color:#111; font-size:24px; line-height:40px; padding:0; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4); z-index:2; }
  #zoomDocs { position:absolute; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:8px; justify-content:center; flex-wrap:wrap; z-index:2; }
  #zoomDocs a { background:#fff; color:#111; border-radius:999px; padding:9px 13px; font-size:14px; font-weight:700; text-decoration:none; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.4); }

  .docsec h3 { margin:0 0 8px; font-size:15px; } .drow { padding:7px 0; border-top:1px solid var(--line); font-size:13.5px; } .drow:first-of-type { border-top:0; }

  /* ---- East Star brand (eaststarusa.com): blue #0078bd / hover #005d9a, navy #15334b, red accent #c92330,

<script>

function $(id) { return document.getElementById(id); }

 *  every server reply goes through this. Only a run that re-encodes to a complete, valid UTF-8 sequence is replaced. */

function call(action, data) {
  var body = Object.assign({ action: action, c: TOKEN }, data || {});

    .then(function (r) { return r.text().then(function (t) { return JSON.parse(unMoji(t)); }); }, function () { throw new Error('No connection. Check your internet and reload the page.'); })
    .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'Something went wrong.'); return j.data; });
}
function fail(m) { m = String(m == null ? '' : m).replace(/Ask East Star(?! Max)/g, 'Ask East Star Max'); $('title').textContent = 'East Star Max'; $('sub').textContent = ''; $('main').innerHTML = '<div class="msgbox">' + esc(m) + '</div>'; }
function render(p) {
  var title = p.name ? p.name : (p.num ? 'Project #' + p.num : 'Your project');
  if (window.I18N) I18N.setTitle(title + ' · East Star Max'); else document.title = title + ' · East Star Max';
  $('title').textContent = title; $('title').classList.toggle('notr', !!p.name);
  $('sub').textContent = (p.name && p.num ? 'Project #' + p.num + ' · ' : '') + (p.updated ? 'Updated ' + new Date(p.updated).toLocaleDateString(window.I18N && I18N.lang() === 'zh' ? 'zh-CN' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '');
  var notes = (p.notes || []).filter(function (n) { return n.text || (n.items || []).length || (n.photos || []).length; });
  if (!notes.length) { $('main').innerHTML = '<div class="msgbox">Nothing has been added to this project yet.</div>'; return; }
  $('main').innerHTML = notes.map(function (n) {

// ---- spec sheet / install guide links (20261016r): docs.json is the public {code: [spec_url, install_url]} map from the item bundle (no prices).
var DOCS = null;
function docLinks(d, sep) { var a = []; if (d[0]) a.push('<a href="' + esc(d[0]) + '" target="_blank" rel="noopener">' + esc(T('Spec sheet')) + '</a>');
  if (d[1]) a.push('<a href="' + esc(d[1]) + '" target="_blank" rel="noopener">' + esc(T('Install guide')) + '</a>'); return a.join(sep || ''); }
function addDocs(notes) {

    var seen = {}, rows = [];
    notes.forEach(function (n) { (n.items || []).forEach(function (l) { var d = DOCS[l.name]; if (!d || seen[l.name]) return; seen[l.name] = 1;
